<fieldset class="cbi-section">
  <legend>使用说明</legend>
  <p>此插件需要配合雷神加速器手机 APP 使用。路由器插件负责把选定设备的游戏流量接入雷神线路，账号、套餐和暂停操作请在官方 APP 内完成。</p>
  <p><strong>兼容模式：</strong>本固件使用官方 OpenWrt 引擎 1.2.2.52，使用 TUN 独立隧道和专用 LAN 转发规则，运行时暂停硬件 NAT，关闭服务后恢复原设置。启用前请停用其他透明代理服务，避免默认路由或 DNS 规则互相覆盖。</p>
  <p><strong>设备识别：</strong>在“设备管理”中确认客户端设备类型；新接入设备可能需要等待 ARP/DHCP 信息更新后才会出现。</p>
  <p><strong>隐私提示：</strong>启用后，雷神组件会连接其官方服务器；服务关闭时不会启动加速进程。</p>
</fieldset>
