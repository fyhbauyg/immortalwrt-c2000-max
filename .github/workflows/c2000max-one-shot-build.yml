name: C2000MAX one-shot firmware build

on:
  push:
    branches:
      - v36.5
    paths:
      - ".github/workflows/c2000max-one-shot-build.yml"
      - "configs/c2000max.config"
      - "package/custom/c2000max-board/**"
      - "package/custom/qmodem/**"
      - "package/mtk/drivers/mt_wifi7/**"
      - "package/mtk/drivers/wifi-profile/**"
      - "package/mtk/applications/mtk-smp/**"
      - "package/mtk/applications/c2000max-appfilter/**"
      - "package/mtk/applications/luci-app-eqos-mtk/**"
      - "package/mtk/applications/luci-app-c2000max-traffic/**"
      - "package/network/config/firewall4/patches/002-c2000max-preserve-eqos-flow-path.patch"
      - "target/linux/mediatek/files-6.12/drivers/net/ethernet/mediatek/mtk_hnat/**"
      - "target/linux/mediatek/patches-6.12/**"
      - "target/linux/mediatek/image/filogic.mk"
      - "target/linux/mediatek/dts/mt7987a-nradio-c2000-max.dts"
      - "target/linux/mediatek/filogic/base-files/**"
      - "scripts/c2000max/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: c2000max-one-shot-build
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip firmware build]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      FORCE_UNSAFE_CONFIGURE: "1"
      SOURCE_DATE_EPOCH: "1784306413"
      LC_ALL: C
      TZ: UTC

    steps:
      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run C2000MAX preflight tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/c2000max/verify-c2000max-firmware.sh
          package/mtk/applications/luci-app-c2000max-traffic/tests/test_traffic.sh
          bash package/custom/c2000max-board/tests/test_sim_switch.sh
          bash package/custom/c2000max-board/tests/test_sysupgrade_emmc.sh
          bash package/custom/c2000max-board/tests/test_wifi_performance.sh
          bash package/custom/c2000max-board/tests/test_daed_hybrid.sh
          node --check package/mtk/applications/luci-app-eqos-mtk/htdocs/luci-static/resources/view/eqos.js
          node --check package/mtk/applications/luci-app-c2000max-traffic/htdocs/luci-static/resources/view/c2000max/traffic.js

      - name: Restore downloads and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: ${{ runner.os }}-c2000max-v3-${{ hashFiles('feeds.conf.default', 'configs/c2000max.config') }}
          restore-keys: |
            ${{ runner.os }}-c2000max-v3-

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential clang flex bison g++ gawk gcc-multilib g++-multilib             gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools             rsync swig unzip zlib1g-dev file wget curl libelf-dev device-tree-compiler             cpio qemu-utils ca-certificates patch perl

      - name: Install locked feeds
        shell: bash
        run: |
          ./scripts/feeds update -a
          for feed in packages luci routing telephony video; do
            ./scripts/feeds install -a -p "$feed"
          done
          git -C feeds/packages apply \
            "$GITHUB_WORKSPACE/scripts/c2000max/packages-go126-module-root.patch"
          git -C feeds/packages apply \
            "$GITHUB_WORKSPACE/scripts/c2000max/packages-daed-generated-assets.patch"
          bash scripts/c2000max/apply-v365-feed-fixes.sh
          git -C feeds/luci/applications/luci-app-firewall apply \
            "$GITHUB_WORKSPACE/scripts/c2000max/luci-firewall-sonic-fullcone.patch"
          git -C feeds/luci apply \
            "$GITHUB_WORKSPACE/scripts/c2000max/luci-version-v365.patch"
          git -C feeds/luci apply \
            "$GITHUB_WORKSPACE/scripts/c2000max/luci-compat-mlo-list-device.patch"
          git -C feeds/luci apply \
            "$GITHUB_WORKSPACE/scripts/c2000max/luci-system-official-boot.patch"
          git -C feeds/luci apply \
            "$GITHUB_WORKSPACE/scripts/c2000max/luci-official-readonly-v365.patch"
          bash package/custom/c2000max-board/tests/test_port_role.sh
          bash package/custom/c2000max-board/tests/test_low_memory_services.sh
          bash package/custom/c2000max-board/tests/test_owe_gcmp256.sh
          bash package/custom/c2000max-board/tests/test_sonic_fullcone.sh
          bash package/custom/c2000max-board/tests/test_v365_safety.sh
          bash package/custom/c2000max-board/tests/test_official_boot_once.sh
          bash package/custom/c2000max-board/tests/test_wifi_performance.sh
          bash package/custom/c2000max-board/tests/test_luci_mlo_compat.sh
          bash package/custom/c2000max-board/tests/test_status_overview.sh

      - name: Generate C2000MAX configuration
        shell: bash
        run: |
          cp configs/c2000max.config .config
          make defconfig
          sed -i "s#^CONFIG_CCACHE_DIR=.*#CONFIG_CCACHE_DIR=\"$GITHUB_WORKSPACE/.ccache\"#" .config
          printf '\nCONFIG_CCACHE=y\n' >> .config
          grep -E '^CONFIG_(TARGET_mediatek_filogic_DEVICE_nradio_c2000-max|TARGET_ROOTFS_PARTSIZE|MTK_HWIFI_MT7993|PACKAGE_c2000max-board|PACKAGE_qmodem|PACKAGE_luci-base)=' .config

      - name: Download and verify sources
        shell: bash
        run: |
          make -j"$(nproc)" download
          # Only remove failed top-level downloads.  Go keeps an expanded
          # module cache below dl/go-mod-cache where valid source files can be
          # smaller than 1 KiB; deleting those files corrupts whole modules.
          find dl -maxdepth 1 -type f -size -1024c -print -delete

      - name: Build firmware
        shell: bash
        run: |
          # mt_hwifi contains out-of-tree modules whose package metadata can be
          # regenerated without rebuilding the objects.  Always invalidate the
          # entire driver family before a kernel-ABI-changing build.
          make package/mtk/drivers/mt_hwifi/clean
          if ! make -j"$(nproc)" world; then
            make -j1 V=s world
          fi

      - name: Collect and checksum images
        shell: bash
        run: |
          test -d bin/targets/mediatek/filogic
          manifest="$(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*nradio_c2000-max.manifest' -print -quit)"
          rootfs="$(find build_dir/target-* -maxdepth 1 -type d -name root-mediatek -print -quit)"
          test -n "$manifest"
          test -n "$rootfs"
          bash scripts/c2000max/verify-c2000max-firmware.sh "$manifest" "$rootfs"
          driver_source="$(find build_dir/target-* -path '*/mt_wifi7/mt_wifi/common/fsm/ap_mgmt_assoc.c' -print -quit)"
          test -n "$driver_source"
          bash package/mtk/drivers/mt_wifi7/tests/test_owe_ie.sh "$driver_source"
          mkdir -p c2000max-artifacts
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            -exec cp -a {} c2000max-artifacts/ \;
          test -n "$(find c2000max-artifacts -maxdepth 1 -type f -name '*nradio_c2000-max*' -print -quit)"

      - name: Assemble validated SD image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_name='C2000MAX-V36.5-traffic-management'
          mapfile -d '' sysupgrades < <(
            find c2000max-artifacts -maxdepth 1 -type f \
              -name '*nradio_c2000-max*-sysupgrade.bin' -print0
          )
          test "${#sysupgrades[@]}" -eq 1
          mv "${sysupgrades[0]}" \
            "c2000max-artifacts/${release_name}-sysupgrade.bin"

          mkdir -p c2000max-reference
          gh release download c2000max-v35.35-port-role-lock-r1 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*sdcard.img.gz' --dir c2000max-reference
          mapfile -d '' references < <(
            find c2000max-reference -maxdepth 1 -type f \
              -name '*sdcard.img.gz' -print0
          )
          test "${#references[@]}" -eq 1
          gzip -dc "${references[0]}" > c2000max-reference/reference.img

          python3 scripts/c2000max/assemble-c2000max-sdcard.py \
            c2000max-reference/reference.img \
            "c2000max-artifacts/${release_name}-sysupgrade.bin" \
            "c2000max-artifacts/${release_name}-sdcard.img" \
            --overlay-mib 64 | tee c2000max-artifacts/sdcard-assembly.txt
          gzip -n -9 "c2000max-artifacts/${release_name}-sdcard.img"
          gzip -t "c2000max-artifacts/${release_name}-sdcard.img.gz"

      - name: Finalize release checksums
        shell: bash
        run: |
          release_name='C2000MAX-V36.5-traffic-management'
          (
            cd c2000max-artifacts
            find . -maxdepth 1 -type f ! -name c2000max-build-sha256sums.txt \
              -printf '%f\0' | sort -z | xargs -0 sha256sum \
              > c2000max-build-sha256sums.txt
            sha256sum \
              "${release_name}-sysupgrade.bin" \
              "${release_name}-sdcard.img.gz" > SHA256SUMS
            md5sum \
              "${release_name}-sysupgrade.bin" \
              "${release_name}-sdcard.img.gz" > MD5SUMS
            ls -lh
          )

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: C2000MAX-V36.5-traffic-management
          path: |
            c2000max-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_name='C2000MAX-V36.5-traffic-management'
          release_tag='v36.5'
          source_sha="$GITHUB_SHA"

          # Release creation rejects GITHUB_TOKEN when its target modifies
          # .github/workflows relative to the default branch. Keep the source
          # tree intact while matching only those workflow files to the default
          # branch in an unreferenced release-anchor commit.
          default_branch="$(
            gh repo view "${GITHUB_REPOSITORY}" \
              --json defaultBranchRef --jq '.defaultBranchRef.name'
          )"
          default_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/commits/${default_branch}" \
              --jq '.sha'
          )"
          source_tree_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/commits/${source_sha}" \
              --jq '.tree.sha'
          )"
          default_tree_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/commits/${default_sha}" \
              --jq '.tree.sha'
          )"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/git/trees/${source_tree_sha}?recursive=1" \
            > "$RUNNER_TEMP/c2000max-source-tree.json"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/git/trees/${default_tree_sha}?recursive=1" \
            > "$RUNNER_TEMP/c2000max-default-tree.json"
          workflow_entries="$(
            jq -n \
              --slurpfile source "$RUNNER_TEMP/c2000max-source-tree.json" \
              --slurpfile default "$RUNNER_TEMP/c2000max-default-tree.json" '
                ([
                  $source[0].tree[]
                  | select((.path | startswith(".github/workflows/")) and .type != "tree")
                  | {
                      key: .path,
                      value: { path: .path, mode: .mode, type: .type, sha: null }
                    }
                ] + [
                  $default[0].tree[]
                  | select((.path | startswith(".github/workflows/")) and .type != "tree")
                  | {
                      key: .path,
                      value: { path: .path, mode: .mode, type: .type, sha: .sha }
                    }
                ])
                | from_entries
                | [.[]]
              '
          )"
          if test "$(jq 'length' <<<"$workflow_entries")" -eq 0; then
            release_target="$source_sha"
          else
            release_tree_sha="$(
              jq -n \
                --arg base_tree "$source_tree_sha" \
                --argjson tree "$workflow_entries" \
                '{ base_tree: $base_tree, tree: $tree }' \
              | gh api --method POST \
                  "/repos/${GITHUB_REPOSITORY}/git/trees" --input - \
              | jq -r '.sha'
            )"
            release_target="$(
              jq -n \
                --arg message \
                  "C2000MAX V36.5 release anchor for ${source_sha}" \
                --arg tree "$release_tree_sha" \
                --arg parent "$source_sha" \
                '{ message: $message, tree: $tree, parents: [$parent] }' \
              | gh api --method POST \
                  "/repos/${GITHUB_REPOSITORY}/git/commits" --input - \
              | jq -r '.sha'
            )"
          fi
          test -n "$release_target"

          cat > release-notes.md <<EOF
          C2000MAX V36.5 性能与安全改进固件。新镜像需要在 TF 上完成实机验收。

          核心更新：
          - 修复 MT7993 OWE ECDH IE 跨字段复制告警，保留 FORTIFY 和严格长度检查。
          - 无线高性能模式完整处理 L1SS、TPO、PST、LP，带状态读回与失败回滚。
          - C2000MAX 双 PPE 流表改为 16K，减少固定内存分配；减少 USB 根集线器误探测。
          - 新增默认关闭的 5G NR SQM 预设及加速/设备限速互斥，停止队列后再恢复原选择。
          - 保留用户自定义 LAN 地址，提供只读 c2000max-netcheck 与 iperf3/ethtool。
          - 官方 SPI 全部可见分区只读，停用所有一次性切换写入脚本；关机拔 TF 卡启动官方系统。
          - WAN 和双 WAN 继续使用经过回退处理的软件加速，不恢复已知有问题的 WAN HNAT。
          - Wi-Fi 吞吐、游戏满载延迟和长期内存稳定性尚需刷入 TF 后实测，不承诺固定提升比例。

          构建来源：
          - 分支：v36.5
          - 提交：${GITHUB_SHA}
          - Actions：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Release 至少包含可保留配置升级的 sysupgrade.bin 和完整写卡用的 sdcard.img.gz；校验值见 SHA256SUMS 与 MD5SUMS。
          EOF

          assets=(
            "c2000max-artifacts/${release_name}-sysupgrade.bin"
            "c2000max-artifacts/${release_name}-sdcard.img.gz"
            c2000max-artifacts/SHA256SUMS
            c2000max-artifacts/MD5SUMS
            c2000max-artifacts/sdcard-assembly.txt
          )
          if gh release view "$release_tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "$release_tag" --repo "${GITHUB_REPOSITORY}" \
              --title 'C2000MAX V36.5 - 性能与安全' \
              --notes-file release-notes.md
          else
            gh release create "$release_tag" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "$release_target" \
              --title 'C2000MAX V36.5 - 性能与安全' \
              --notes-file release-notes.md
          fi
